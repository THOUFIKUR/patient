name: mobile
description: "MediKiosk — SIH26047 Patient Case-Taking Software (Ministry of AYUSH / AIIA)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # === State Management ===
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # === Navigation ===
  go_router: ^14.6.1

  # === Networking ===
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # === Secure Storage ===
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  # === Localization ===
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # === Audio (Voice Intake) ===
  record: ^5.2.1
  audioplayers: ^6.1.0
  just_audio: ^0.9.42
  permission_handler: ^11.3.1

  # === Camera / Documents ===
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # === UI / Fonts ===
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # === Utilities ===
  uuid: ^4.5.1
  path_provider: ^2.1.4
  path: ^1.9.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # === Icons ===
  cupertino_icons: ^1.0.8

dependency_overrides:
  record_platform_interface: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/mock/
